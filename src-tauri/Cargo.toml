[package]
name = "novelforge-ai"
version = "2.6.0"
description = "NovelForge AI - Professional Multi-Agent Long-form Novel Creation System"
authors = ["NovelForge Team"]
edition = "2024"
default-run = "novelforge-ai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "novelforge_ai_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# ==============================================================================
# 本地开发 (Debug) 瘦身与提速配置
# ==============================================================================
[profile.dev]
# 自身代码保留行号信息（调试报错依然有清晰行号和堆栈，体积缩减过半）
debug = 1

# 对所有第三方依赖库（tokio/tauri/rusqlite 等）关闭调试符号，并开启轻度优化
[profile.dev.package."*"]
opt-level = 1
debug = 0
